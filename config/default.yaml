summarization:
  model: "google/gemma-3-12b-it"
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "float16"
  attn_implementation: "eager"
  batch_size: 2
  max_input_chars: 3000
  max_new_tokens: 256
  temperature: 0.1
  repetition_penalty: 1.05
  seed: 42

# ---- Stage 6 artifact bundle paths (artifacts_guide.md) ----
# All four files must come from the same build (row_idx invariant).
artifacts:
  stage6_dir: "data/stage6_data"
  chunk_store_sqlite: "data/stage6_data/chunk_store.sqlite"
  chunk_meta_slim: "data/stage6_data/chunk_meta_slim.parquet"
  faiss_index: "data/stage6_data/faiss_index__BAAI_bge-m3.index"
  embed_model_meta: "data/stage6_data/embed_model_meta__BAAI_bge-m3.json"
  kg_pickle: "data/kg.gpickle"

embedding:
  model: "BAAI/bge-m3"
  dim: 1024
  use_fp16: true
  batch_summary: 32
  batch_full: 8
  max_len_summary: 256
  max_len_full: 1024

bm25:
  k1: 1.5
  b: 0.75
  fts_mode: "fts_fast"   # "fts_fast" (default) or "bm25_ranked"
  use_pyvi: false        # set true on Kaggle where pyvi is installed

# ---- Retrieval: simplified 7-stage pipeline (retrieval.md) ----
# Router → Decompose? → Hybrid Retrieve → Rerank → Graph Expand → Final Select → Answer
# FAISS-only dense backend, in-memory NetworkX graph. No remote services
# (qdrant / pg / neo4j backends were removed in the redesign).
retrieval:
  # --- Stage 3: Hybrid retrieve (base values; scaled by router depth) ---
  top_bm25: 80           # lexical candidates (wide for recall-first)
  top_dense: 80          # FAISS full index candidates (Stage 6 contract)
  rrf_k: 60
  fused_pool_size: 120   # unique chunks after RRF fusion
  use_dense: true        # disable for CPU-only lexical baseline

  # --- Stage 4: Rerank on the ORIGINAL query (cross-encoder) ---
  rerank_model: "BAAI/bge-reranker-v2-m3"
  rerank_input_size: 70  # chunks reranked (base; scaled by rerank_strength)
  rerank_text_truncate: 512
  use_reranker: true     # disable for CPU-only baseline

  # --- Stage 5: Graph expand (in-memory NetworkX, lane-gated) ---
  graph_expand_seeds: 8         # top reranked chunks used as seeds
  graph_expanded_top: 60        # cap on the post-expansion pool
  graph_discount_doc: 0.6       # 1-hop DOC→DOC expansion score discount
  graph_discount_concept: 0.3   # concept co-mention discount (if present)

  # --- Stage 6: Final select budgets come from the lane (final_selector.py) ---
  seed: 42

# ---- Router (router.py) ----
router:
  use_llm: false          # rule-based by default; inject an LLM to override
  long_query_words: 30    # ≥ this → treat as potentially multi-hop / mixed
  decompose_lanes: ["cross_doc", "scenario"]
  graph_expand_lanes: ["cross_doc", "scenario", "procedure_detail"]

# ---- Decomposer (decomposer.py) ----
decomposer:
  use_llm: false          # rule-based fallback by default
  max_sub_questions: 5
  min_sub_query_chars: 10
  dedup_threshold: 0.85